  <circle cx="280" cy="450" r="200" fill="none" stroke="white" stroke-width="2" opacity="0.6" />
  <circle cx="520" cy="450" r="200" fill="none" stroke="white" stroke-width="2" opacity="0.6" />

  <!-- Circle labels -->
  <text x="400" y="120" text-anchor="middle" fill="white" font-family="Montserrat, sans-serif" font-size="28" font-weight="bold" letter-spacing="2">ARCHITECTURE</text>
  <text x="140" y="560" text-anchor="middle" fill="white" font-family="Montserrat, sans-serif" font-size="28" font-weight="bold" letter-spacing="2">BIOMIMICRY</text>
  <text x="660" y="560" text-anchor="middle" fill="white" font-family="Montserrat, sans-serif" font-size="28" font-weight="bold" letter-spacing="2">ALGORITHM</text>

  <!-- Center intersection -->
