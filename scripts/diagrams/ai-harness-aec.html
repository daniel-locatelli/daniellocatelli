<title id="ai-harness-aec-title">An AI harness for AEC</title>
<desc id="ai-harness-aec-desc">One shared model sits at the exact centre of the diagram, wrapped in a larger panel labelled the AI harness. Design intent enters from above and lands on the model. The harness reaches out along a solid arrow to each of five checks ringed around it: structure, fabricability, material, cost and carbon. Each check returns a dashed arrow that passes back through the harness and lands on the model at the core, so every verdict is written into the one shared model.</desc>
