<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 344" role="img" aria-labelledby="chat-pipeline-pt-title chat-pipeline-pt-desc">
<title id="chat-pipeline-pt-title">Como o chat da página inicial responde a uma pergunta</title>
<desc id="chat-pipeline-pt-desc">Diagrama de arquitetura: no build, o conteúdo markdown do site é condensado em um perfil por idioma e empacotado no Worker; em tempo de execução, o perfil do idioma do visitante vai ao Claude junto com a pergunta, com cache de prompt, e o Claude transmite a resposta de volta à página.</desc>
