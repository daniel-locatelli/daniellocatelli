<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 344" role="img" aria-labelledby="chat-pipeline-pt-title chat-pipeline-pt-desc">
<title id="chat-pipeline-pt-title">Como o chat da página inicial responde a uma pergunta</title>
<desc id="chat-pipeline-pt-desc">Diagrama de arquitetura: no build, o conteúdo markdown do site é dividido em trechos de conhecimento, transformado em embeddings pela Voyage AI e armazenado no Supabase; em tempo de execução, a pergunta do visitante é embutida, os trechos mais próximos são recuperados e passados ao Claude, que transmite uma resposta fundamentada de volta à página.</desc>
