<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 344" role="img" aria-labelledby="chat-pipeline-de-title chat-pipeline-de-desc">
<title id="chat-pipeline-de-title">Wie der Chat auf der Startseite eine Frage beantwortet</title>
<desc id="chat-pipeline-de-desc">Architekturdiagramm: Beim Build werden die Markdown-Inhalte der Website zu einem Profil pro Sprache verdichtet und in den Worker gebündelt; zur Laufzeit geht das Profil in der Sprache des Besuchers zusammen mit der Frage an Claude, per Prompt-Caching zwischengespeichert, und Claude streamt die Antwort zurück auf die Seite.</desc>
