<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-labelledby="translation-pt-title translation-pt-desc">
<title id="translation-pt-title">Como uma mudança de conteúdo chega aos outros dois idiomas</title>
<desc id="translation-pt-desc">Diagrama: quando um arquivo de conteúdo ou de textos da interface muda em um idioma, o Claude Code lê a regra do repositório e escreve os arquivos correspondentes nos outros dois idiomas. Campos estruturais, como datas e links, são mantidos idênticos; campos traduzíveis, como nomes de países e o corpo do texto, são traduzidos. Nenhum serviço de tradução está envolvido.</desc>
