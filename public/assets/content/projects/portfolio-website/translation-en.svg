<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-labelledby="translation-en-title translation-en-desc">
<title id="translation-en-title">How a content change reaches the other two languages</title>
<desc id="translation-en-desc">Diagram: when a content file or an interface-strings file changes in one language, Claude Code reads the repository's rule and writes the corresponding files in the other two languages. Structural fields such as dates and links are kept identical; translatable fields such as country names and the body text are translated. No translation service is involved.</desc>
