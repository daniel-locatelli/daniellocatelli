<rect x="136" y="56" width="99" height="28" rx="4" fill="#000000"/>
<text x="148" y="76" fill="#71717a" font-size="17" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing="0.16em">PUBLIC</text>
<rect x="152" y="106" width="1296" height="84" rx="10" fill="#18181b" stroke="#34d399" stroke-width="1.5"/>
<text x="800" y="142" text-anchor="middle" fill="#f4f4f5" font-size="20" font-weight="600" font-family="ui-sans-serif, system-ui, sans-serif">DOKwood dictionary · hm/dokwood</text>
<text x="800" y="168" text-anchor="middle" fill="#a1a1aa" font-size="15" font-family="ui-sans-serif, system-ui, sans-serif">generic, high-level vocabulary for timber buildups: classes · 129 properties · ISO 23387 data templates</text>
<text x="800" y="220" text-anchor="middle" fill="#71717a" font-size="15" font-family="ui-sans-serif, system-ui, sans-serif">anyone can read it and reference it</text>
<rect x="120" y="360" width="1360" height="230" rx="16" fill="rgba(244,244,245,0.02)" stroke="rgba(244,244,245,0.10)" stroke-width="1.5"/>
<rect x="136" y="346" width="111.5" height="28" rx="4" fill="#000000"/>
<text x="148" y="366" fill="#71717a" font-size="17" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing="0.16em">PRIVATE</text>
<rect x="152" y="400" width="405.3333333333333" height="100" rx="10" fill="#18181b" stroke="#f4f4f5" stroke-width="1.5"/>
