<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 800" role="img" aria-labelledby="dokwood-bsdd-title"><title id="dokwood-bsdd-title">Two levels of data dictionaries: the public hm/dokwood dictionary on bSDD above, and below it the private dictionary of each tenant, forked from the public one and specialised, or started from a clean slate; tenants can optionally open and interlink their dictionaries, and an interfaces box at the bottom: the Revit add-in, Cadwork plugin and MCP server all read through this dictionary layer</title>
<defs><marker id="dokwood-bsdd-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#a1a1aa"/></marker></defs>
