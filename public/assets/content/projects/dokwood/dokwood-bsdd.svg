<text x="800" y="726" text-anchor="middle" fill="#f4f4f5" font-size="20" font-weight="600" font-family="ui-sans-serif, system-ui, sans-serif">Revit add-in · Cadwork plugin · MCP server</text>
<text x="800" y="752" text-anchor="middle" fill="#a1a1aa" font-size="15" font-family="ui-sans-serif, system-ui, sans-serif">all read through the dictionary layer, which is what makes them interoperable</text>
