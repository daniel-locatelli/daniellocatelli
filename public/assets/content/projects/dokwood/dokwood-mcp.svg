<text x="800" y="552" text-anchor="middle" fill="#71717a" font-size="15" font-family="ui-sans-serif, system-ui, sans-serif">MCP over stdio or HTTP on the client side, authenticated GraphQL with tenant context on the platform side: one interface for every MCP-aware tool instead of one ERP connector per partner</text>
