<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 760" role="img" aria-labelledby="kfw-frontend-title"><title id="kfw-frontend-title">Routes at the top fan out to five Angular components: the Neubau and Sanierung calculators, each with forms feeding a service that drives the output (dashboard and charts) and a save action; the Portfolio with a Neubau list and a Sanierung list; Profile (change password, delete account) and Settings (change theme, change language). Both save actions write to a shared database, from which the Portfolio loads saved projects.</title>
