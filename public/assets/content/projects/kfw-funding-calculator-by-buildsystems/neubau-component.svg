<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 650" role="img" aria-labelledby="kfw-neubau-title"><title id="kfw-neubau-title">The Neubau component opens two forms, Projekt and Darlehen, each a form component with its own service; both feed the Neubau service, which drives the Projekt output (dashboard plus Gesamtkosten, Gesamtkosten per m² and Einheitskosten charts), the Darlehen output (dashboard plus Annuitäten, Finanzierungskosten and Tilgung charts) and a save option.</title>
