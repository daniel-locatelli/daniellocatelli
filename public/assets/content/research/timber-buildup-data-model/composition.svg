<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" role="img" aria-labelledby="bsdd-composition-title"><title id="bsdd-composition-title">The external wall from the cover as data. The wall, a buildup, has eight layers as parts, from outside to inside: larch cladding, battens, façade membrane, gypsum fibre board, stud zone, solid timber panel, service cavity and inner lining. The stud zone in turn has parts in a pattern that repeats every 625 mm along the wall: timber stud, mineral wool, timber stud. The mineral wool points to one product; both timber studs point to the same timber stud product. The service cavity follows the same pattern and is not drawn.</title>
