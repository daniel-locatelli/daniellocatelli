<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 660" role="img" aria-labelledby="bsdd-template-to-sheet-title"><title id="bsdd-template-to-sheet-title">Three sheets with the same five properties: sound insulation, fire resistance, heat loss, thickness and cladding. The data template, made by a timber company, has empty value fields; arrows labelled fill lead from it to both sheets. The requirement sheet of a project holds required values such as sound insulation at least 50 dB and fire resistance at least REI 60; the data sheet of the wall as built, dataholz awmohi02a-04, holds 53 dB, REI 90 from inside and REI 60 from outside, a heat loss of 0.15 and 451.5 mm. An arrow labelled checked against leads from the data sheet to the requirement sheet.</title>
