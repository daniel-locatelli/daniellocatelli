<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 640" role="img" aria-labelledby="bsdd-data-sheet-to-dpp-title"><title id="bsdd-data-sheet-to-dpp-title">The data sheet of the wall as built, dataholz awmohi02a-04, with values such as sound insulation 53 dB and fire resistance REI 90 from inside and REI 60 from outside, feeds a digital product passport, which keeps those values, each already linked to its dictionary entry, and adds a unique ID, the proof behind them (certificates, test reports, environmental data), the wall's stage from designed to built, and a tag on the wall, a QR code or RFID chip, that opens the passport when scanned</title>
<defs><marker id="bsdd-data-sheet-to-dpp-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#a1a1aa"/></marker></defs>
<rect width="100%" height="100%" fill="#000000"/>
<path d="M130 95 H498 L520 117 V515 a10 10 0 0 1 -10 10 H130 a10 10 0 0 1 -10 -10 V105 a10 10 0 0 1 10 -10 Z" fill="#18181b" stroke="#34d399" stroke-width="1.5"/>
<path d="M498 95 V117 H520" fill="#09090b" stroke="#34d399" stroke-width="1.5"/>
<text x="148" y="135" fill="#f4f4f5" font-size="24" font-weight="600" font-family="ui-sans-serif, system-ui, sans-serif">Data sheet</text>
<text x="148" y="161" fill="#a1a1aa" font-size="15" font-family="ui-sans-serif, system-ui, sans-serif">declared or measured values</text>
<line x1="140" y1="185" x2="500" y2="185" stroke="rgba(244,244,245,0.10)" stroke-width="1.5"/>
<text x="148" y="218" fill="#f4f4f5" font-size="16" font-family="ui-sans-serif, system-ui, sans-serif">Sound insulation</text>
<text x="148" y="238" fill="#71717a" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">Rw · dB</text>
<text x="492" y="228" text-anchor="end" fill="#34d399" font-size="18" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">53</text>
<line x1="140" y1="253" x2="500" y2="253" stroke="rgba(244,244,245,0.10)" stroke-width="1"/>
<text x="148" y="280" fill="#f4f4f5" font-size="16" font-family="ui-sans-serif, system-ui, sans-serif">Fire resistance</text>
<text x="148" y="300" fill="#71717a" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">REI · inside / outside</text>
<text x="492" y="290" text-anchor="end" fill="#34d399" font-size="18" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">REI 90 / 60</text>
<line x1="140" y1="315" x2="500" y2="315" stroke="rgba(244,244,245,0.10)" stroke-width="1"/>
<text x="148" y="342" fill="#f4f4f5" font-size="16" font-family="ui-sans-serif, system-ui, sans-serif">Heat loss</text>
<text x="148" y="362" fill="#71717a" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">U · W/(m²·K)</text>
<text x="492" y="352" text-anchor="end" fill="#34d399" font-size="18" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">0.15</text>
<line x1="140" y1="377" x2="500" y2="377" stroke="rgba(244,244,245,0.10)" stroke-width="1"/>
<text x="148" y="404" fill="#f4f4f5" font-size="16" font-family="ui-sans-serif, system-ui, sans-serif">Thickness</text>
<text x="148" y="424" fill="#71717a" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">d · mm</text>
<text x="492" y="414" text-anchor="end" fill="#34d399" font-size="18" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">451.5</text>
<line x1="140" y1="439" x2="500" y2="439" stroke="rgba(244,244,245,0.10)" stroke-width="1"/>
<text x="148" y="466" fill="#f4f4f5" font-size="16" font-family="ui-sans-serif, system-ui, sans-serif">Cladding</text>
<text x="148" y="486" fill="#71717a" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">timber species</text>
<text x="492" y="476" text-anchor="end" fill="#34d399" font-size="18" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">larch</text>
<text x="320" y="555" text-anchor="middle" fill="#71717a" font-size="14" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">dataholz awmohi02a-04 · the wall as built</text>
<path d="M670 95 H1458 L1480 117 V515 a10 10 0 0 1 -10 10 H670 a10 10 0 0 1 -10 -10 V105 a10 10 0 0 1 10 -10 Z" fill="#18181b" stroke="#34d399" stroke-width="1.5"/>
<path d="M1458 95 V117 H1480" fill="#09090b" stroke="#34d399" stroke-width="1.5"/>
<text x="688" y="135" fill="#f4f4f5" font-size="24" font-weight="600" font-family="ui-sans-serif, system-ui, sans-serif">Digital Product Passport</text>
<text x="688" y="161" fill="#a1a1aa" font-size="15" font-family="ui-sans-serif, system-ui, sans-serif">to be required by EU law for construction products</text>
<line x1="680" y1="185" x2="1460" y2="185" stroke="rgba(244,244,245,0.10)" stroke-width="1.5"/>
<text x="688" y="228" fill="#f4f4f5" font-size="16" font-family="ui-sans-serif, system-ui, sans-serif">A unique ID</text>
<text x="860" y="218" fill="#34d399" font-size="15" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">one code for this wall, for good</text>
<text x="860" y="238" fill="#71717a" font-size="13" font-family="ui-sans-serif, system-ui, sans-serif">points back to this passport</text>
<line x1="680" y1="253" x2="1460" y2="253" stroke="rgba(244,244,245,0.10)" stroke-width="1"/>
<text x="688" y="290" fill="#f4f4f5" font-size="16" font-family="ui-sans-serif, system-ui, sans-serif">The values</text>
<text x="860" y="280" fill="#34d399" font-size="15" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">53 dB · REI 90 / 60 · 0.15 · 451.5 mm · larch</text>
<text x="860" y="300" fill="#71717a" font-size="13" font-family="ui-sans-serif, system-ui, sans-serif">already linked to their dictionary entries</text>
<line x1="680" y1="315" x2="1460" y2="315" stroke="rgba(244,244,245,0.10)" stroke-width="1"/>
<text x="688" y="352" fill="#f4f4f5" font-size="16" font-family="ui-sans-serif, system-ui, sans-serif">The proof</text>
<text x="860" y="342" fill="#34d399" font-size="15" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">certificates · test reports · environmental data</text>
<text x="860" y="362" fill="#71717a" font-size="13" font-family="ui-sans-serif, system-ui, sans-serif">the documents behind the values</text>
<line x1="680" y1="377" x2="1460" y2="377" stroke="rgba(244,244,245,0.10)" stroke-width="1"/>
<text x="688" y="414" fill="#f4f4f5" font-size="16" font-family="ui-sans-serif, system-ui, sans-serif">Its stage</text>
<text x="860" y="404" fill="#34d399" font-size="15" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">designed → built</text>
<text x="860" y="424" fill="#71717a" font-size="13" font-family="ui-sans-serif, system-ui, sans-serif">the passport follows the wall</text>
<line x1="680" y1="439" x2="1460" y2="439" stroke="rgba(244,244,245,0.10)" stroke-width="1"/>
<text x="688" y="476" fill="#f4f4f5" font-size="16" font-family="ui-sans-serif, system-ui, sans-serif">A tag on the wall</text>
<text x="860" y="466" fill="#34d399" font-size="15" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">QR code or RFID chip</text>
<text x="860" y="486" fill="#71717a" font-size="13" font-family="ui-sans-serif, system-ui, sans-serif">scan the wall, open its passport</text>
