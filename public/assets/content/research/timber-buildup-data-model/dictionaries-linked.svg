<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 540" role="img" aria-labelledby="bsdd-dictionaries-linked-title"><title id="bsdd-dictionaries-linked-title">Two data dictionaries side by side. This article's dictionary, hm/dokwood, has one entry for the European fire resistance class EN 13501-2, with the example value REI 90, and a separate entry for the German class DIN 4102-2, with the example value F90; the two are kept apart because the fire tests differ. The ETIM dictionary, used by manufacturers and wholesalers, has its own entries for the same two classes. Each entry has its own web address, and an arrow labelled is equal to links each hm/dokwood entry to its ETIM twin.</title>
