<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 720" role="img" aria-labelledby="bsdd-templates-title"><title id="bsdd-templates-title">Left: Wall, Roof and Slab are kinds of Buildup, a System Data Template composed of layers and products, where a product is a Product Data Template. Right: a data template lists properties, a requirement template and then a requirement sheet tighten them to required values, and a data sheet satisfies them with declared values</title>
